:root{--bg:#050606;--card:#100e09;--line:#332a17;--gold:#d6ad56;--gold2:#f1cf79;--text:#fff;--muted:#938f87;--display:"Barlow Condensed",sans-serif;--body:"Inter",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);min-height:100%}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh;background:radial-gradient(circle at 50% 0%,#171207 0%,#080806 42%,#050606 72%)}
.topbar{height:74px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #211d13}.back-btn{display:none;align-items:center;gap:10px;background:transparent;border:0;color:#fff;font-weight:700;font-size:14px;padding:10px 4px}.back-arrow{font-size:28px;color:var(--gold)}
.view{display:none}.view.active{display:block}.container{width:min(1280px,100%);margin:auto;padding:0 20px 42px}
.brand-header{text-align:center;padding:34px 0 18px}.brand-logo-wrap{height:230px;width:100%;display:flex;align-items:center;justify-content:center;padding:0 20px}.brand-logo{width:min(760px,92vw);height:100%;object-fit:contain;display:block}.brand-fallback{font-family:var(--display);font-size:70px;letter-spacing:.08em;color:var(--gold);font-weight:800;line-height:.9}.brand-fallback small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.55em;margin-top:14px;color:var(--gold2)}.brand-sub{margin:8px 0 0;color:var(--muted);font-size:16px}
.search-wrap{position:relative;margin:30px auto 46px;max-width:900px}.search-wrap input{width:100%;border:1px solid var(--line);background:#0c0b08;color:#fff;border-radius:999px;padding:19px 22px 19px 52px;outline:none;font-size:16px}.search-wrap input:focus{border-color:var(--gold)}.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:21px;color:var(--muted)}
.section-label,.ensaios-label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#b9944d;font-weight:700;margin-bottom:18px}.school-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.school-card{min-height:235px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,#120f09,#0d0c09);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;transition:.2s}.school-card:hover{border-color:rgba(214,173,86,.65);transform:translateY(-2px)}

.ensaio-card{width:100%;border:1px solid #211d13;background:#0c0b08;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:15px;color:#fff;text-align:left}.ensaio-date{min-width:62px;color:var(--gold2);font-family:var(--display);font-size:23px;line-height:.9;text-align:center}.ensaio-meta{flex:1}.ensaio-title{font-size:15px;font-weight:800}.ensaio-sub{font-size:12px;color:var(--muted);margin-top:4px}.chev{color:var(--gold);font-size:25px}
.gallery-hero{text-align:center;padding:34px 0 24px}.gallery-hero .school-logo{width:82px;height:82px;margin:0 auto 16px}.gallery-hero h2{font-family:var(--display);font-size:42px;line-height:1;margin:0 0 8px;color:#fff}.date-sub{color:var(--muted);font-size:14px}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.photo-thumb{aspect-ratio:1;background:#111;overflow:hidden;cursor:pointer;border-radius:4px}.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.photo-thumb:hover img{transform:scale(1.04)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}.lightbox.open{display:flex}.lightbox-close{position:absolute;right:18px;top:14px;background:transparent;border:0;color:white;font-size:40px;z-index:4}.lightbox-stage{width:100%;height:calc(100vh - 86px);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.lightbox-img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.lightbox-bar{height:86px;display:flex;align-items:center;justify-content:center}.download-btn{border:1px solid var(--line);border-radius:999px;background:#0c0b08;color:#fff;padding:14px 25px;text-decoration:none;font-weight:700}.photo-counter{position:absolute;top:23px;left:20px;color:#bbb;font-size:13px}.swipe-hint{position:absolute;bottom:92px;color:#777;font-size:12px;pointer-events:none}
.state{text-align:center;padding:55px 20px;color:var(--muted)}.spin{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;color:#8b6e35;font-size:11px;letter-spacing:.2em;padding:28px 12px 34px}

const DRIVE_API="https://www.googleapis.com/drive/v3/files";
const MONTHS=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const state={schools:[],currentSchool:null,ensaios:[],currentEnsaio:null,photos:[],currentPhoto:0};
const $=s=>document.querySelector(s);const el=(tag,cls)=>{const x=document.createElement(tag);if(cls)x.className=cls;return x};
const thumbUrl=(id,size=1400)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${size}`;
const downloadUrl=id=>`https://drive.google.com/uc?export=download&id=${id}`;
const initial=name=>(name||"?").trim().charAt(0).toUpperCase();
const isConfigured=()=>GOOGLE_API_KEY&&!GOOGLE_API_KEY.includes("COLE_SUA_NOVA_API_KEY");

async function driveList(parentId,folders=false){
 const q=folders?`'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`:`'${parentId}' in parents and mimeType contains 'image/' and trashed=false`;
 const p=new URLSearchParams({q,fields:"files(id,name)",orderBy:"name",pageSize:folders?"200":"1000",key:GOOGLE_API_KEY});
 const r=await fetch(`${DRIVE_API}?${p}`);if(!r.ok)throw new Error(r.status);return ((await r.json()).files)||[];
}
const driveListFolders=id=>driveList(id,true);const driveListImages=id=>driveList(id,false);

async function findLogo(folderId){
 const files=await driveListImages(folderId).catch(()=>[]);
 return (files.find(f=>f.name.toLowerCase().includes("logo"))||{}).id||null;
}

function showView(name){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$(`#view-${name}`).classList.add("active");
 $("#backBtn").style.display=name==="home"?"none":"inline-flex";
 $("#backLabel").textContent=name==="school"?"Escolas":(state.currentSchool?.name||"Voltar");
 window.scrollTo({top:0,behavior:"smooth"});
}
$("#backBtn").onclick=()=>$("#view-gallery").classList.contains("active")?renderSchool(state.currentSchool):showView("home");

function renderLogo(container,school,size=300){
 container.innerHTML="";container.textContent=initial(school.name);
 if(!school.logoId)return;
 const img=new Image();img.src=thumbUrl(school.logoId,size);img.alt=school.name;img.onload=()=>{container.innerHTML="";container.appendChild(img)};
}

async function loadHome(){
 const grid=$("#schoolGrid");grid.innerHTML='<div class="state"><div class="spin"></div><p>Carregando escolas…</p></div>';
 if(!isConfigured()){grid.innerHTML='<div class="state"><h3>API ainda não configurada</h3><p>Cole sua nova API Key no topo do index.html.</p></div>';return}
 try{
  state.schools=(await driveListFolders(ROOT_FOLDER_ID)).map(f=>({...f,logoId:null}));grid.innerHTML="";
  if(!state.schools.length){grid.innerHTML='<div class="state"><h3>Nenhuma escola encontrada</h3><p>Verifique a pasta BAMBA.</p></div>';return}
  for(const school of state.schools){
   const card=el("button","school-card");card.type="button";card.dataset.name=school.name.toLowerCase();
   const logo=el("div","school-logo");logo.textContent=initial(school.name);const name=el("div","school-name");name.textContent=school.name;
   card.append(logo,name);card.onclick=()=>openSchool(school);grid.appendChild(card);
   findLogo(school.id).then(id=>{school.logoId=id;if(id){const img=new Image();img.src=thumbUrl(id,400);img.alt=school.name;img.onload=()=>{logo.innerHTML="";logo.appendChild(img)}}});
  }
 }catch(e){console.error(e);grid.innerHTML='<div class="state"><h3>Não foi possível carregar as escolas</h3><p>Confira a API Key, as restrições do domínio e o compartilhamento do Drive.</p></div>'}
}

$("#searchInput").oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".school-card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"":"none")};

function parseEnsaioFolder(name){
 const m=name.match(/^(\d{2})-(\d{2})-(\d{4})(?:[_-](.+))?$/);
 if(!m)return{date:null,label:name,sortKey:name,day:"",monthIndex:0,monthLabel:"",year:""};
 const[,day,month,year,label]=m,monthIndex=+month-1;return{date:new Date(`${year}-${month}-${day}T00:00:00`),day,monthIndex,monthLabel:MONTHS[monthIndex],year,label:label||"Ensaio Fotográfico",sortKey:`${year}${month}${day}`};
}

async function openSchool(school){
 state.currentSchool=school;renderSchool(school);showView("school");const list=$("#ensaioList");list.innerHTML='<div class="state"><div class="spin"></div><p>Carregando ensaios…</p></div>';
 try{
  state.ensaios=(await driveListFolders(school.id)).map(f=>({...f,...parseEnsaioFolder(f.name)})).sort((a,b)=>b.sortKey.localeCompare(a.sortKey));list.innerHTML="";
  if(!state.ensaios.length){list.innerHTML='<div class="state"><p>Nenhum ensaio encontrado.</p></div>';return}
  state.ensaios.forEach(x=>{const card=el("button","ensaio-card");card.type="button";const date=el("div","ensaio-date");date.innerHTML=x.date?`${x.day}<br><span style="font-size:12px">${x.monthLabel}</span>`:"FOTOS";const meta=el("div","ensaio-meta");meta.innerHTML=`<div class="ensaio-title">${x.label}</div><div class="ensaio-sub">${x.date?`${x.day}.${String(x.monthIndex+1).padStart(2,"0")}.${x.year}`:x.name}</div>`;const arrow=el("div","chev");arrow.textContent="›";card.append(date,meta,arrow);card.onclick=()=>openGallery(x);list.appendChild(card)});
 }catch(e){console.error(e);list.innerHTML='<div class="state"><p>Não foi possível carregar os ensaios.</p></div>'}
}
function renderSchool(school){$("#schoolNameBig").textContent=school.name;renderLogo($("#schoolLogoBig"),school,500)}

async function openGallery(ensaio){
 state.currentEnsaio=ensaio;renderLogo($("#schoolLogoGallery"),state.currentSchool,400);
 $("#galleryDateTitle").textContent=ensaio.date?`${ensaio.day}.${String(ensaio.monthIndex+1).padStart(2,"0")}.${ensaio.year}`:ensaio.name;$("#galleryLabel").textContent=ensaio.label;showView("gallery");
 const grid=$("#galleryGrid");grid.innerHTML='<div class="state"><div class="spin"></div><p>Carregando fotos…</p></div>';
 try{state.photos=await driveListImages(ensaio.id);grid.innerHTML="";if(!state.photos.length){grid.innerHTML='<div class="state"><p>Nenhuma foto encontrada.</p></div>';return}
 state.photos.forEach((p,i)=>{const t=el("div","photo-thumb"),img=new Image();img.src=thumbUrl(p.id,800);img.alt=p.name;img.loading="lazy";t.appendChild(img);t.onclick=()=>openLightbox(i);grid.appendChild(t)})}
 catch(e){console.error(e);grid.innerHTML='<div class="state"><p>Não foi possível carregar as fotos.</p></div>'}
}

function openLightbox(i){if(!state.photos.length)return;state.currentPhoto=i;$("#lightbox").classList.add("open");$("#lightbox").setAttribute("aria-hidden","false");updateLightbox()}
function updateLightbox(){const p=state.photos[state.currentPhoto];if(!p)return;$("#lightboxImg").src=thumbUrl(p.id,2200);$("#lightboxImg").alt=p.name;$("#lightboxDownload").href=downloadUrl(p.id);$("#photoCounter").textContent=`${state.currentPhoto+1} / ${state.photos.length}`}
function closeLightbox(){$("#lightbox").classList.remove("open");$("#lightbox").setAttribute("aria-hidden","true")}
function nextPhoto(){state.currentPhoto=(state.currentPhoto+1)%state.photos.length;updateLightbox()}
function previousPhoto(){state.currentPhoto=(state.currentPhoto-1+state.photos.length)%state.photos.length;updateLightbox()}
$("#lightboxClose").onclick=closeLightbox;
document.addEventListener("keydown",e=>{if(!$("#lightbox").classList.contains("open"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowRight")nextPhoto();if(e.key==="ArrowLeft")previousPhoto()});
let sx=0,sy=0;const stage=$("#lightboxStage");stage.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});stage.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy))return;dx<0?nextPhoto():previousPhoto()},{passive:true});

function setupBambaLogo(){
 const logo=$("#bambaLogo"),fallback=$("#brandFallback");
 logo.src=BAMBA_LOGO_FILE;
 logo.onload=()=>{fallback.style.display="none";logo.style.display="block"};
 logo.onerror=()=>{logo.style.display="none";fallback.style.display="block"};
}
setupBambaLogo();loadHome();
</script>
