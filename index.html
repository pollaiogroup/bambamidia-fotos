<style>
/* ============================================================
   BAMBA | MÍDIA DE CARNAVAL — design tokens
   Identidade oficial: preto absoluto + dourado metálico.
   Letras angulares, traços de pluma dourada em arco.
   ============================================================ */
:root{
  --black:#000000;
  --black-soft:#0A0806;
  --panel:#120E09;
  --gold-light:#F6E3A1;
  --gold:#D9A94D;
  --gold-deep:#8A6A22;
  --cream:#F2ECDD;
  --muted:#8C8577;
  --line:rgba(217,169,77,0.16);
  --line-soft:rgba(242,236,221,0.08);
  --card:rgba(217,169,77,0.045);
  --card-hover:rgba(217,169,77,0.09);
  --radius:18px;
  --font-display:'Anton', sans-serif;
  --font-body:'Manrope', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 480px at 50% -8%, rgba(217,169,77,0.10), transparent 62%),
    var(--black);
  color:var(--cream);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::selection{background:var(--gold);color:var(--black);}

#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:64px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px 6px;
}
.brandmark-img{height:22px;width:auto;display:block;filter:drop-shadow(0 0 6px rgba(217,169,77,0.25));}
.back-btn{
  display:none;align-items:center;gap:8px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--cream);
  padding:9px 14px 9px 10px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:background .18s ease, transform .18s ease;
}
.back-btn:hover{background:var(--card-hover);}
.back-btn:active{transform:scale(0.97);}
.back-btn svg{width:16px;height:16px;color:var(--gold);}
.view.has-back .back-btn{display:inline-flex;}

/* ---------- Gold plume signature (hero only) ---------- */
.plume{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:0;
  animation:plume-in 1.1s ease forwards;animation-delay:.15s;}
@keyframes plume-in{to{opacity:1;}}
.plume svg{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:340px;max-width:92%;height:auto;}
@media (prefers-reduced-motion: reduce){ .plume{animation:none;opacity:1;} }

/* ---------- Hero ---------- */
.hero{position:relative;padding:34px 20px 8px;text-align:center;}
.hero .logo-lockup{position:relative;z-index:1;width:200px;max-width:62%;margin:0 auto 14px;display:block;
  filter:drop-shadow(0 0 22px rgba(217,169,77,0.18));}
.hero p{
  color:var(--muted);
  font-size:15.5px;
  margin:0 0 22px;
  letter-spacing:0.01em;
}

/* ---------- Search ---------- */
.search-wrap{padding:0 20px 8px;position:relative;}
.search-wrap input{
  width:100%;
  background:var(--card);
  border:1px solid var(--line-soft);
  color:var(--cream);
  padding:13px 16px 13px 42px;
  border-radius:999px;
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:border-color .18s ease, background .18s ease;
}
.search-wrap input::placeholder{color:var(--muted);}
.search-wrap input:focus{border-color:var(--gold);background:var(--card-hover);}
.search-icon{
  position:absolute;left:36px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
}

/* ---------- Section label ---------- */
.section-label{
  padding:26px 20px 12px;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold-deep);
  font-weight:700;
}

/* ---------- School grid ---------- */
.school-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 20px;
}
.school-card{
  background:var(--card);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:18px 14px 16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;
  transition:transform .16s ease, background .16s ease, border-color .16s ease;
}
.school-card:hover{background:var(--card-hover);border-color:var(--line);}
.school-card:active{transform:scale(0.97);}
.school-logo{
  width:60px;height:60px;border-radius:50%;
  background:var(--panel);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--gold);
  border:1px solid var(--line);
}
.school-logo img{width:100%;height:100%;object-fit:cover;}
.school-name{font-size:13.5px;font-weight:700;text-align:center;line-height:1.3;}

/* ---------- School page header ---------- */
.school-hero{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:8px 20px 14px;text-align:center;
}
.school-hero .school-logo{width:88px;height:88px;font-size:30px;}
.school-hero h2{font-family:var(--font-display);font-weight:400;font-size:25px;letter-spacing:0.01em;margin:0;}
.ensaios-label{
  padding:22px 20px 10px;
  font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;
}

/* ---------- Ensaio ticket list ---------- */
.ensaio-list{display:flex;flex-direction:column;gap:10px;padding:0 20px;}
.ensaio-card{
  display:flex;align-items:center;gap:16px;
  background:var(--card);
  border:1px solid var(--line-soft);
  border-left:3px solid var(--gold);
  border-radius:14px;
  padding:14px 16px;
  cursor:pointer;
  transition:background .16s ease, transform .16s ease;
}
.ensaio-card:hover{background:var(--card-hover);}
.ensaio-card:active{transform:scale(0.985);}
.ensaio-date{
  font-family:var(--font-display);font-weight:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:52px;line-height:1;
}
.ensaio-date .day{font-size:24px;color:var(--gold);}
.ensaio-date .mon{font-size:11px;letter-spacing:0.08em;color:var(--muted);margin-top:4px;font-family:var(--font-body);font-weight:700;}
.ensaio-meta{flex:1;}
.ensaio-title{font-size:15px;font-weight:700;}
.ensaio-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.chev{width:16px;height:16px;color:var(--gold);flex-shrink:0;}

/* ---------- Gallery ---------- */
.gallery-hero{padding:6px 20px 4px;text-align:center;}
.gallery-hero .brandmark-sm{height:16px;width:auto;margin:0 auto;display:block;opacity:0.9;}
.gallery-hero h2{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:0.01em;margin:10px 0 2px;}
.gallery-hero .date-sub{color:var(--muted);font-size:13.5px;}

.gallery-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:16px 4px 0;
}
.photo-thumb{
  position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;
  background:var(--panel);cursor:pointer;
}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
.photo-thumb:hover img{transform:scale(1.06);}

.gallery-actions{padding:20px 20px 4px;display:flex;justify-content:center;}
.btn-primary{
  background:linear-gradient(100deg,var(--gold-deep),var(--gold) 45%, var(--gold-light));
  color:var(--black);font-weight:800;font-size:13.5px;
  padding:13px 26px;border-radius:999px;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  letter-spacing:0.01em;
}

/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,0.97);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  z-index:100;padding:20px;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:72vh;border-radius:8px;object-fit:contain;}
.lightbox-bar{display:flex;gap:12px;margin-top:18px;}
.lightbox-bar a, .lightbox-bar button{
  background:var(--card);border:1px solid var(--line);color:var(--cream);
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.lightbox-close{
  position:absolute;top:18px;right:18px;
  background:var(--card);border:1px solid var(--line);color:var(--cream);
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ---------- States ---------- */
.state{padding:60px 30px;text-align:center;color:var(--muted);}
.state .spin{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--line-soft);border-top-color:var(--gold);
  margin:0 auto 16px;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.state h3{color:var(--cream);font-family:var(--font-display);font-weight:400;font-size:19px;margin:0 0 6px;letter-spacing:0.01em;}
.state p{font-size:13.5px;margin:0;line-height:1.5;}
.state code{background:var(--card);padding:2px 6px;border-radius:5px;font-size:12px;color:var(--gold-light);}

.view{display:none;}
.view.active{display:block;}

footer.tag{
  position:fixed;bottom:0;left:0;right:0;
  text-align:center;font-size:10px;color:var(--gold-deep);
  padding:12px;letter-spacing:0.14em;font-weight:700;
  background:linear-gradient(0deg, var(--black) 45%, transparent);
}
</style>

<script>
/* ==========================================================================
   BAMBA | MÍDIA DE CARNAVAL — Portal de fotos (MVP)
   Backend: Google Drive (pastas públicas "qualquer pessoa com o link")
   Nenhum servidor próprio é necessário — este é um único arquivo HTML.
   ---------------------------------------------------------------------
   CONFIGURAÇÃO OBRIGATÓRIA (veja SETUP.md para o passo a passo completo):

   1) Crie uma pasta no Google Drive chamada "BAMBA" (pasta raiz).
   2) Dentro dela, uma subpasta por escola (ex: "Escola A").
      - Opcional: dentro da pasta da escola, uma imagem chamada
        "logo" (logo.png / logo.jpg) vira o logo exibido no portal.
   3) Dentro de cada escola, uma subpasta por ensaio, nomeada:
         DD-MM-AAAA                  → título padrão "Ensaio"
         DD-MM-AAAA_Título do ensaio → título customizado
      Ex: "27-08-2026" ou "05-07-2026_Ensaio Técnico"
   4) Suba as fotos dentro da pasta do ensaio.
   5) Compartilhe a pasta raiz "BAMBA" como
      "Qualquer pessoa com o link → Leitor" (o compartilhamento
      é herdado por todas as subpastas e fotos).
   6) Crie uma API Key no Google Cloud Console com a API do Google
      Drive habilitada, e cole abaixo em GOOGLE_API_KEY.
   7) Copie o ID da pasta raiz (está na URL do Drive) e cole em
      ROOT_FOLDER_ID.
   ========================================================================== */

const GOOGLE_API_KEY = "1hgiE1zvNhA5LgE4jWNBjA1PqW3lw7WjC";
const ROOT_FOLDER_ID = "AIzaSyB3GqPptv6AR2W2Ex_qaDmHhUh4aGsCak0";

/* ========================================================================== */

const DRIVE_API = "https://www.googleapis.com/drive/v3/files";
const MONTHS = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

const state = { schools: [], currentSchool: null, ensaios: [], currentEnsaio: null, photos: [] };

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };

function isConfigured(){
  return GOOGLE_API_KEY && !GOOGLE_API_KEY.startsWith("COLE_") &&
         ROOT_FOLDER_ID && !ROOT_FOLDER_ID.startsWith("COLE_");
}

async function driveListFolders(parentId){
  const q = encodeURIComponent(`'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const fields = encodeURIComponent("files(id,name)");
  const url = `${DRIVE_API}?q=${q}&fields=${fields}&orderBy=name&pageSize=200&key=${GOOGLE_API_KEY}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("drive-folders-" + res.status);
  const data = await res.json();
  return data.files || [];
}

async function driveListFiles(parentId){
  const q = encodeURIComponent(`'${parentId}' in parents and mimeType contains 'image/' and trashed=false`);
  const fields = encodeURIComponent("files(id,name)");
  const url = `${DRIVE_API}?q=${q}&fields=${fields}&orderBy=name&pageSize=1000&key=${GOOGLE_API_KEY}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("drive-files-" + res.status);
  const data = await res.json();
  return data.files || [];
}

async function findLogo(folderId){
  const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and name contains 'logo' and trashed=false`);
  const fields = encodeURIComponent("files(id,name)");
  const url = `${DRIVE_API}?q=${q}&fields=${fields}&pageSize=1&key=${GOOGLE_API_KEY}`;
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }catch(e){ return null; }
}

function thumbUrl(fileId, size){ return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size||1000}`; }
function downloadUrl(fileId){ return `https://drive.google.com/uc?export=download&id=${fileId}`; }
function viewUrl(fileId){ return `https://drive.google.com/file/d/${fileId}/view`; }
function folderViewUrl(folderId){ return `https://drive.google.com/drive/folders/${folderId}`; }

function parseEnsaioFolder(name){
  const m = name.match(/^(\d{2})-(\d{2})-(\d{4})(?:_(.+))?$/);
  if(!m) return { date:null, label: name, sortKey: name };
  const [_, dd, mm, yyyy, label] = m;
  const dateObj = new Date(`${yyyy}-${mm}-${dd}T00:00:00`);
  return {
    date: dateObj,
    day: dd,
    monthLabel: MONTHS[dateObj.getMonth()] || mm,
    year: yyyy,
    label: label || "Ensaio",
    sortKey: `${yyyy}${mm}${dd}`
  };
}

/* ---------------- Rendering ---------------- */

function showView(name){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $("#view-" + name).classList.add("active");
  const back = $("#backBtn");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("has-back"));
  if(name === "home"){ back.style.display = "none"; }
  else{
    back.style.display = "inline-flex";
    $("#backLabel").textContent = name === "school" ? "Escolas" : (state.currentSchool ? state.currentSchool.name : "Voltar");
  }
  window.scrollTo({top:0, behavior:"instant"});
}

$("#backBtn").addEventListener("click", () => {
  if($("#view-gallery").classList.contains("active")) renderSchool(state.currentSchool);
  else showView("home");
});

function schoolInitial(name){ return (name || "?").trim().charAt(0).toUpperCase(); }

function renderSchoolCard(container, school, big){
  const logoBox = el("div", "school-logo");
  logoBox.textContent = schoolInitial(school.name);
  container.appendChild(logoBox);
  if(school.logoId){
    const img = new Image();
    img.src = thumbUrl(school.logoId, 200);
    img.alt = school.name;
    img.onload = () => { logoBox.textContent=""; logoBox.appendChild(img); };
  }
  return logoBox;
}

async function loadHome(){
  const grid = $("#schoolGrid");
  grid.innerHTML = "";
  grid.appendChild(el("div","state",`<div class="spin"></div><p>Carregando escolas…</p>`));

  if(!isConfigured()){
    grid.innerHTML = "";
    grid.appendChild(el("div","state",
      `<h3>Portal ainda não configurado</h3>
       <p>Defina <code>GOOGLE_API_KEY</code> e <code>ROOT_FOLDER_ID</code> no topo do arquivo <code>index.html</code>. Veja o <code>SETUP.md</code> para o passo a passo.</p>`));
    return;
  }

  try{
    const folders = await driveListFolders(ROOT_FOLDER_ID);
    state.schools = folders;
    grid.innerHTML = "";
    if(folders.length === 0){
      grid.appendChild(el("div","state",`<h3>Nenhuma escola ainda</h3><p>Crie uma subpasta dentro de "BAMBA" para cada escola.</p>`));
      return;
    }
    for(const school of folders){
      const card = el("div","school-card");
      card.dataset.name = school.name.toLowerCase();
      renderSchoolCard(card, {name:school.name});
      card.appendChild(el("div","school-name", school.name));
      card.addEventListener("click", () => openSchool(school));
      grid.appendChild(card);
      findLogo(school.id).then(logoId => {
        if(!logoId) return;
        const logoBox = card.querySelector(".school-logo");
        const img = new Image();
        img.src = thumbUrl(logoId, 200);
        img.onload = () => { logoBox.textContent=""; logoBox.appendChild(img); };
      });
    }
  }catch(err){
    grid.innerHTML = "";
    grid.appendChild(el("div","state",
      `<h3>Não foi possível carregar as escolas</h3>
       <p>Confira se a pasta raiz está compartilhada como "Qualquer pessoa com o link" e se a API key está correta.</p>`));
    console.error(err);
  }
}

$("#searchInput").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".school-card").forEach(card => {
    card.style.display = card.dataset.name.includes(q) ? "flex" : "none";
  });
});

async function openSchool(school){
  state.currentSchool = school;
  showView("school");
  const logoBig = $("#schoolLogoBig");
  logoBig.textContent = schoolInitial(school.name);
  $("#schoolNameBig").textContent = school.name;
  const list = $("#ensaioList");
  list.innerHTML = "";
  list.appendChild(el("div","state",`<div class="spin"></div><p>Carregando ensaios…</p>`));

  findLogo(school.id).then(logoId => {
    if(!logoId) return;
    const img = new Image();
    img.src = thumbUrl(logoId, 300);
    img.onload = () => { logoBig.textContent=""; logoBig.appendChild(img); };
  });

  try{
    const folders = await driveListFolders(school.id);
    const parsed = folders.map(f => ({ ...f, meta: parseEnsaioFolder(f.name) }))
                           .sort((a,b) => b.meta.sortKey.localeCompare(a.meta.sortKey));
    state.ensaios = parsed;
    list.innerHTML = "";
    if(parsed.length === 0){
      list.appendChild(el("div","state",`<h3>Nenhum ensaio ainda</h3><p>Crie uma subpasta com a data (ex: 27-08-2026) dentro de "${school.name}".</p>`));
      return;
    }
    for(const ensaio of parsed){
      const card = el("div","ensaio-card");
      card.innerHTML = `
        <div class="ensaio-date">
          <span class="day">${ensaio.meta.day || "•"}</span>
          <span class="mon">${ensaio.meta.monthLabel || ""}</span>
        </div>
        <div class="ensaio-meta">
          <div class="ensaio-title">${ensaio.meta.label}</div>
          <div class="ensaio-sub">${ensaio.meta.year || ensaio.name}</div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
      card.addEventListener("click", () => openGallery(ensaio));
      list.appendChild(card);
    }
  }catch(err){
    list.innerHTML = "";
    list.appendChild(el("div","state",`<h3>Não foi possível carregar os ensaios</h3><p>Tente novamente em instantes.</p>`));
    console.error(err);
  }
}

function renderSchool(school){ if(school) openSchool(school); else showView("home"); }

async function openGallery(ensaio){
  state.currentEnsaio = ensaio;
  showView("gallery");
  $("#galleryDateTitle").textContent = ensaio.meta.day ? `${ensaio.meta.day} ${ensaio.meta.monthLabel} ${ensaio.meta.year}` : ensaio.name;
  $("#galleryLabel").textContent = ensaio.meta.label || "Ensaio Fotográfico";
  $("#downloadAllBtn").onclick = () => window.open(folderViewUrl(ensaio.id), "_blank");

  const logoBox = $("#schoolLogoGallery");
  logoBox.textContent = schoolInitial(state.currentSchool.name);
  logoBox.innerHTML = "";
  logoBox.appendChild(document.createTextNode(schoolInitial(state.currentSchool.name)));
  findLogo(state.currentSchool.id).then(logoId => {
    if(!logoId) return;
    const img = new Image();
    img.src = thumbUrl(logoId, 200);
    img.onload = () => { logoBox.textContent=""; logoBox.appendChild(img); };
  });

  const grid = $("#galleryGrid");
  grid.innerHTML = "";
  grid.appendChild(el("div","state",`<div class="spin"></div><p>Carregando fotos…</p>`));

  try{
    const files = await driveListFiles(ensaio.id);
    state.photos = files;
    grid.innerHTML = "";
    if(files.length === 0){
      grid.appendChild(el("div","state",`<h3>Fotos a caminho</h3><p>Ainda não há fotos nesta pasta.</p>`));
      return;
    }
    files.forEach((file, idx) => {
      const thumb = el("div","photo-thumb");
      const img = new Image();
      img.loading = "lazy";
      img.src = thumbUrl(file.id, 500);
      img.alt = file.name;
      thumb.appendChild(img);
      thumb.addEventListener("click", () => openLightbox(idx));
      grid.appendChild(thumb);
    });
  }catch(err){
    grid.innerHTML = "";
    grid.appendChild(el("div","state",`<h3>Não foi possível carregar as fotos</h3><p>Tente novamente em instantes.</p>`));
    console.error(err);
  }
}

/* ---------------- Lightbox ---------------- */
function openLightbox(idx){
  const file = state.photos[idx];
  if(!file) return;
  $("#lightboxImg").src = thumbUrl(file.id, 1600);
  $("#lightboxDownload").href = downloadUrl(file.id);
  $("#lightboxShare").href = viewUrl(file.id);
  $("#lightbox").classList.add("open");
}
$("#lightboxClose").addEventListener("click", () => $("#lightbox").classList.remove("open"));
$("#lightbox").addEventListener("click", (e) => { if(e.target.id === "lightbox") $("#lightbox").classList.remove("open"); });

/* ---------------- Boot ---------------- */
loadHome();
</script>
</body>
</html>
